# 每天检查 Claude 官方来源，安全更新仓库，并调用独立工作流发布页面。
name: 更新 Claude 演进全景

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: claude-panorama-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查官方来源并更新数据
        run: python3 work/update-claude-panorama.py

      - name: 重建单文件网页
        run: python3 work/build-page.py

      - name: 运行完整测试
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: 检查本轮是否有版本变化
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交自动更新
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "claude-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            work/timeline-data.json \
            work/source-state.json \
            outputs/claude-evolution-panorama.html \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "没有需要提交的受控文件。"
          else
            git commit -m "更新: 同步 Claude 官方发布"
            git push
          fi

  deploy-pages:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-claude-pages.yml
